name: Debug inner dockerd

on:
  workflow_dispatch:

jobs:
  privileged:
    runs-on: ubuntu-22.04
    steps:
      - name: Control, official dind image
        run: |
          docker run -d --name ctl --privileged docker:27-dind >/dev/null
          for i in $(seq 1 30); do docker exec ctl docker ps >/dev/null 2>&1 && { echo "CONTROL_DIND_OK after $((i*2))s"; break; }; sleep 2; done
          docker logs ctl 2>&1 | grep -E "level=(error|fatal|warning)" | head -10 || true
          docker rm -f ctl >/dev/null 2>&1 || true
      - name: Runner image, manual dockerd with full log
        run: |
          docker pull -q justachillguy/dibench-runner:latest
          docker run --rm --entrypoint docker justachillguy/dibench-runner:latest --version
          docker run --rm --entrypoint sh justachillguy/dibench-runner:latest -c 'cat /etc/docker/daemon.json 2>/dev/null; echo; ls /etc/docker; echo; cat /etc/os-release | head -3'
          for variant in "default" "nonet"; do
            echo "=================== manual dockerd: $variant ==================="
            docker rm -f probe >/dev/null 2>&1 || true
            docker run -d --name probe --privileged --security-opt apparmor=unconfined --security-opt seccomp=unconfined --entrypoint tail justachillguy/dibench-runner:latest -f /dev/null >/dev/null
            if [ "$variant" = "nonet" ]; then FLAGS="--iptables=false --ip6tables=false --bridge=none"; else FLAGS=""; fi
            docker exec probe sh -c "nohup dockerd $FLAGS > /tmp/d.log 2>&1 &"
            ok=0; for i in $(seq 1 45); do docker exec probe docker ps >/dev/null 2>&1 && { ok=1; break; }; sleep 2; done
            echo "docker ps works after $((i*2))s: $ok  [$variant]"
            docker exec probe sh -c "ps aux | grep -E 'dockerd|containerd' | grep -v grep | cut -c1-150"
            echo "--- non-plugin dockerd log lines ---"
            docker exec probe sh -c "grep -vE 'loading plugin|skip loading plugin|serving\.\.\. address' /tmp/d.log | tail -60"
            docker rm -f probe >/dev/null 2>&1 || true
          done

  sysbox:
    runs-on: ubuntu-22.04
    steps:
      - name: Install sysbox runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uname -r; lsb_release -ds
          gh release download -R nestybox/sysbox --pattern 'sysbox-ce_*linux_amd64.deb' -D /tmp/sysbox
          ls -la /tmp/sysbox
          docker rm -f $(docker ps -aq) >/dev/null 2>&1 || true
          sudo apt-get install -y -q /tmp/sysbox/*.deb 2>&1 | tail -5
          sleep 5
          sudo systemctl status sysbox --no-pager 2>&1 | head -8 || true
          docker info 2>/dev/null | grep -iA3 "Runtimes" || true
      - name: Runner image under sysbox
        run: |
          docker pull -q justachillguy/dibench-runner:latest
          docker run -d --name probe --runtime=sysbox-runc justachillguy/dibench-runner:latest >/dev/null
          ok=0; for i in $(seq 1 45); do docker exec probe docker ps >/dev/null 2>&1 && { ok=1; break; }; sleep 2; done
          echo "SYSBOX docker ps works after $((i*2))s: $ok"
          docker logs probe 2>&1 | grep -vE "loading plugin|skip loading plugin|serving\.\.\. address|Waiting for dockerd" | tail -30
          docker rm -f probe >/dev/null 2>&1 || true
